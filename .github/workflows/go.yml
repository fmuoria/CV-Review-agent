name: Go CI

on:
  push:
    branches: [ main, phase1-ats ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ats
          POSTGRES_PASSWORD: ats
          POSTGRES_DB: ats_test
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U ats" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install pdftotext
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Verify dependencies
        run: go mod verify
      - name: Format check
        run: test -z "$(gofmt -s -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://ats:ats@localhost:5432/ats_test?sslmode=disable
        run: go test -race ./...
      - name: Docker build
        run: docker build -t sinapis-ats .
