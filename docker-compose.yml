# Local development: Postgres + the app in demo-AI mode.
#   docker compose up --build      then open http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ats
      POSTGRES_PASSWORD: ats
      POSTGRES_DB: ats
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ats"]
      interval: 3s
      retries: 20
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    ports: ["8080:8080"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://ats:ats@db:5432/ats?sslmode=disable
      STORAGE_DIR: /var/data/files
    volumes: [files:/var/data]
volumes:
  dbdata:
  files:
